<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Compare and copy 10 text case formats for code, prose, and niche tools." />
    <meta name="theme-color" content="#101827" />
    <title>Case Converter — TinyStack</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1018;
        --bg-elevated: #111a29;
        --surface: rgba(18, 29, 45, .78);
        --surface-strong: #162338;
        --surface-soft: #101a2a;
        --text: #eef5ff;
        --muted: #91a3bc;
        --subtle: #6e819b;
        --line: rgba(153, 177, 211, .16);
        --line-strong: rgba(153, 177, 211, .28);
        --accent: #62d6c7;
        --accent-strong: #32b9ae;
        --accent-ink: #072824;
        --violet: #9a8cff;
        --danger: #ff927f;
        --shadow: 0 24px 70px rgba(0, 0, 0, .22);
        --radius-lg: 24px;
        --radius-md: 16px;
        --radius-sm: 12px;
      }
      * { box-sizing: border-box; }
      html { min-width: 320px; scroll-behavior: smooth; }
      body { min-height: 100vh; margin: 0; color: var(--text); background: var(--bg); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
      body::before { position: fixed; z-index: -1; inset: 0; content: ""; pointer-events: none; background: radial-gradient(circle at 12% 6%, rgba(98, 214, 199, .13), transparent 28%), radial-gradient(circle at 88% 20%, rgba(154, 140, 255, .12), transparent 25%), linear-gradient(180deg, rgba(255,255,255,.025), transparent 30%); }
      body.light { color-scheme: light; --bg: #f4f7fb; --bg-elevated: #ffffff; --surface: rgba(255, 255, 255, .84); --surface-strong: #ffffff; --surface-soft: #f0f4f8; --text: #182337; --muted: #66758c; --subtle: #8491a5; --line: rgba(43, 67, 100, .13); --line-strong: rgba(43, 67, 100, .23); --accent: #159d92; --accent-strong: #087c75; --accent-ink: #ffffff; --violet: #6659d6; --shadow: 0 24px 70px rgba(45, 67, 99, .10); }
      body.light::before { background: radial-gradient(circle at 12% 6%, rgba(21, 157, 146, .12), transparent 28%), radial-gradient(circle at 88% 20%, rgba(102, 89, 214, .09), transparent 25%), linear-gradient(180deg, rgba(255,255,255,.7), transparent 30%); }
      button, input { font: inherit; }
      button { cursor: pointer; }
      button:disabled { cursor: default; }
      .skip-link { position: absolute; left: 16px; top: 10px; z-index: 10; transform: translateY(-180%); padding: 9px 12px; border-radius: 10px; color: var(--bg); background: var(--text); font-size: 13px; font-weight: 700; }
      .skip-link:focus { transform: translateY(0); }
      .site-header { border-bottom: 1px solid var(--line); background: rgba(11, 16, 24, .42); backdrop-filter: blur(18px); }
      .light .site-header { background: rgba(244, 247, 251, .68); }
      .header-inner, main, footer { width: min(100% - 40px, 1160px); margin: 0 auto; }
      .header-inner { display: flex; align-items: center; justify-content: flex-end; min-height: 76px; }
      .brand { display: inline-flex; align-items: center; gap: 11px; color: var(--text); text-decoration: none; }
      .brand-mark { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; color: var(--accent-ink); background: linear-gradient(135deg, var(--accent), #8ce8dd); box-shadow: 0 8px 22px rgba(98, 214, 199, .2); font-size: 14px; font-weight: 900; }
      .brand-copy { display: grid; gap: 1px; }
      .brand-name { font-size: 14px; font-weight: 800; letter-spacing: -.01em; }
      .brand-kicker { color: var(--subtle); font-size: 10px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
      .theme-toggle { display: inline-grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 12px; color: var(--muted); background: var(--surface); transition: color .2s, border-color .2s, transform .2s, background .2s; }
      .theme-toggle:hover, .theme-toggle:focus-visible { color: var(--text); border-color: var(--line-strong); background: var(--surface-strong); transform: translateY(-1px); }
      .theme-toggle:focus-visible, .copy-button:focus-visible, .clear-button:focus-visible, .case-input:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 34%, transparent); outline-offset: 2px; }
      .theme-toggle svg { width: 17px; height: 17px; }
      main { padding: 40px 0 74px; }
      .tool-heading { display: grid; gap: 8px; margin-bottom: 32px; }
      .eyebrow { display: inline-flex; align-items: center; gap: 8px; color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      .eyebrow::before { width: 24px; height: 1px; content: ""; background: currentColor; }
      h1, h2, p { margin: 0; }
      h1 { max-width: 680px; font-size: clamp(30px, 5vw, 42px); line-height: 1.12; letter-spacing: -.045em; }
      .tool-description { max-width: 700px; color: var(--muted); font-size: 15px; line-height: 1.6; }
      .intro { max-width: 620px; color: var(--muted); font-size: clamp(16px, 2.2vw, 19px); line-height: 1.65; }
      .input-panel { display: grid; gap: 18px; margin-bottom: 54px; padding: 22px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow); backdrop-filter: blur(18px); animation: rise .4s .04s ease-out both; }
      .input-meta { display: flex; align-items: start; justify-content: space-between; gap: 16px; }
      .input-title { display: grid; gap: 5px; }
      .input-label { color: var(--text); font-size: 14px; font-weight: 800; letter-spacing: -.01em; }
      .input-help { color: var(--muted); font-size: 13px; line-height: 1.5; }
      .counter { flex: 0 0 auto; padding: 6px 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--subtle); background: var(--surface-soft); font-size: 11px; font-weight: 700; }
      .input-wrap { position: relative; }
      .case-input { width: 100%; min-height: 80px; resize: vertical; padding: 18px 58px 18px 18px; border: 1px solid var(--line-strong); border-radius: var(--radius-md); color: var(--text); background: var(--surface-soft); font-size: 17px; line-height: 1.5; transition: border-color .2s, box-shadow .2s, background .2s; }
      .case-input::placeholder { color: var(--subtle); }
      .case-input:focus { border-color: color-mix(in srgb, var(--accent) 74%, var(--line-strong)); outline: none; box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 13%, transparent); }
      .clear-button { position: absolute; top: 14px; right: 14px; display: inline-grid; place-items: center; width: 30px; height: 30px; border: 1px solid transparent; border-radius: 9px; color: var(--subtle); background: transparent; transition: color .2s, background .2s, border-color .2s; }
      .clear-button:hover:not(:disabled), .clear-button:focus-visible { color: var(--text); border-color: var(--line); background: var(--surface-strong); }
      .clear-button:disabled { opacity: .25; }
      .clear-button svg { width: 16px; height: 16px; }
      .sections { display: grid; gap: 42px; }
      .section { display: grid; gap: 16px; animation: rise .45s .1s ease-out both; }
      .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 18px; }
      .section-heading-copy { display: grid; gap: 6px; }
      h2 { font-size: 20px; line-height: 1.2; letter-spacing: -.035em; }
      .section-description { max-width: 560px; color: var(--muted); font-size: 14px; line-height: 1.55; }
      .section-count { color: var(--subtle); font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
      .cards { display: grid; grid-template-columns: 1fr; gap: 12px; }
      .case-card { display: grid; gap: 20px; min-height: 194px; padding: 20px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); box-shadow: 0 12px 35px rgba(0,0,0,.06); transition: border-color .2s, transform .2s, background .2s; }
      .case-card:hover { border-color: var(--line-strong); background: var(--surface-strong); transform: translateY(-2px); }
      .case-card-top { display: grid; gap: 8px; }
      .case-name { display: inline-flex; align-items: center; gap: 8px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; font-weight: 800; }
      .case-name::before { width: 7px; height: 7px; border-radius: 50%; content: ""; background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 11%, transparent); }
      .card-description { color: var(--muted); font-size: 13px; line-height: 1.55; }
      .case-card-bottom { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 12px; margin-top: auto; }
      .output { min-height: 43px; overflow-x: auto; padding: 12px 13px; border: 1px solid var(--line); border-radius: 10px; color: var(--text); background: var(--surface-soft); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
      .output.empty { color: var(--subtle); }
      .copy-button { min-height: 43px; padding: 10px 14px; border: 1px solid var(--line-strong); border-radius: 10px; color: var(--text); background: transparent; font-size: 12px; font-weight: 800; transition: color .2s, border-color .2s, background .2s, transform .2s; }
      .copy-button:hover:not(:disabled) { color: var(--accent-ink); border-color: var(--accent); background: var(--accent); transform: translateY(-1px); }
      .copy-button:active:not(:disabled) { transform: translateY(0); }
      .copy-button:disabled { color: var(--subtle); opacity: .45; }
      footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 100px; padding: 24px 0; border-top: 1px solid var(--line); color: var(--subtle); font-size: 12px; }
      .footer-brand { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-weight: 700; }
      .footer-mark { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 6px; color: var(--accent-ink); background: var(--accent); font-size: 9px; font-weight: 900; }
      .footer-brand:hover { color: var(--text); }
      .toast { position: fixed; right: 20px; bottom: 20px; z-index: 4; display: inline-flex; align-items: center; gap: 8px; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: 12px; color: var(--text); background: var(--surface-strong); box-shadow: var(--shadow); font-size: 12px; font-weight: 700; opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .2s, transform .2s; }
      .toast.show { opacity: 1; transform: translateY(0); }
      .toast::before { width: 7px; height: 7px; border-radius: 50%; content: ""; background: var(--accent); }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @media (max-width: 760px) { .header-inner, main, footer { width: min(100% - 28px, 1160px); } main { padding-top: 46px; } h1 { font-size: clamp(40px, 12vw, 58px); } .cards { grid-template-columns: 1fr; } }
      @media (max-width: 520px) { .header-inner, main, footer { width: min(100% - 24px, 1160px); } main { padding-bottom: 48px; } .input-panel { padding: 16px; border-radius: 18px; } .input-meta, .section-heading, footer { align-items: start; flex-direction: column; } .section-heading { gap: 8px; } .case-card { min-height: 0; padding: 17px; } .case-card-bottom { grid-template-columns: 1fr; align-items: stretch; } .copy-button { width: 100%; } footer { gap: 10px; padding: 22px 0; } }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header"><div class="header-inner"><button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light mode" title="Switch theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg></button></div></header>
    <main id="main-content">
      <section class="tool-heading" aria-labelledby="page-title"><h1 id="page-title">🔤 Case Converter</h1><p class="tool-description">Compare and copy 10 text case formats for code, prose, and niche tools</p></section>
      <section class="input-panel" aria-labelledby="input-title"><div class="input-meta"><div class="input-title"><label class="input-label" id="input-title" for="case-input">Text to convert</label><p class="input-help">Paste text once, then copy the format that fits your target.</p></div><span class="counter" id="char-count">0 characters</span></div><div class="input-wrap"><textarea class="case-input" id="case-input" rows="2" placeholder="Try something like: design system tokens..." autocomplete="off" spellcheck="false"></textarea><button class="clear-button" id="clear-button" type="button" aria-label="Clear text" title="Clear text" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></section>
      <div class="sections" id="sections"></div>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script>
      const groups = [
        { title: 'Code styles', description: 'Common in identifiers, URLs, and code-facing strings.', items: [['camelCase', 'Common in JavaScript variables and object keys.', 'camel'], ['PascalCase', 'Useful for React components and class names.', 'pascal'], ['snake_case', 'Common in Python names and database fields.', 'snake'], ['kebab-case', 'Good for URLs, file names, and CSS-friendly strings.', 'kebab'], ['CONSTANT_CASE', 'Often used for constants and enum-like keys.', 'constant']] },
        { title: 'Readable', description: 'Better for prose, headings, and copy decks.', items: [['Title Case', 'A natural fit for headings and labels.', 'title'], ['Sentence case', 'Reads more naturally in UI copy and prose.', 'sentence'], ['lowercase', 'Keeps text normalized and understated.', 'lower'], ['UPPERCASE', 'Adds emphasis for legacy labels or loud states.', 'upper']] },
        { title: 'Other transforms', description: 'Handy when you need a literal match for niche tools.', items: [['dot.case', 'Works for namespaced keys and niche slug formats.', 'dot']] }
      ];
      const input = document.getElementById('case-input'); const sections = document.getElementById('sections'); const toast = document.getElementById('toast'); const clearButton = document.getElementById('clear-button'); const charCount = document.getElementById('char-count'); let toastTimer;
      function codeTokens(value) { return value.trim() ? value.trim().split(/\s+/) : []; }
      function readableTokens(value) { return value.trim() ? value.trim().replace(/([a-z\d])([A-Z])/g, '$1 $2').split(/\s+/) : []; }
      function separatedTokens(value) { return codeTokens(value).flatMap(word => word.replace(/([a-z\d])([A-Z])/g, '$1 $2').split(/\s+/)); }
      function capitalize(word) { return word ? word[0].toUpperCase() + word.slice(1).toLowerCase() : word; }
      function codeCapitalize(word) { return word ? word[0].toUpperCase() + word.slice(1) : word; }
      function transform(value, type) { const code = codeTokens(value); const separated = separatedTokens(value); const readable = readableTokens(value); if (!code.length) return ''; if (type === 'camel') return code.map((word, i) => i ? codeCapitalize(word) : word.toLowerCase()).join(''); if (type === 'pascal') return code.map(codeCapitalize).join(''); if (type === 'snake') return separated.map(word => word.toLowerCase()).join('_'); if (type === 'kebab') return separated.map(word => word.toLowerCase()).join('-'); if (type === 'constant') return separated.map(word => word.toUpperCase()).join('_'); if (type === 'title') return readable.map(capitalize).join(' '); if (type === 'sentence') { const result = readable.map(word => word.toLowerCase()).join(' '); return capitalize(result); } if (type === 'lower') return readable.map(word => word.toLowerCase()).join(' '); if (type === 'upper') return readable.map(word => word.toUpperCase()).join(' '); if (type === 'dot') return separated.map(word => word.toLowerCase()).join('.'); return value; }
      function render() { const value = input.value; const count = value.length; charCount.textContent = `${count.toLocaleString()} ${count === 1 ? 'character' : 'characters'}`; clearButton.disabled = !value; sections.innerHTML = groups.map(group => { const id = `section-${group.title.replace(/\W+/g, '-').toLowerCase()}`; return `<section class="section" aria-labelledby="${id}"><div class="section-heading"><div class="section-heading-copy"><h2 id="${id}">${group.title}</h2><p class="section-description">${group.description}</p></div><span class="section-count">${group.items.length} ${group.items.length === 1 ? 'format' : 'formats'}</span></div><div class="cards">${group.items.map(([name, description, type]) => { const result = transform(value, type); return `<article class="case-card"><div class="case-card-top"><div class="case-name">${name}</div><p class="card-description">${description}</p></div><div class="case-card-bottom"><div class="output${result ? '' : ' empty'}" data-output="${type}">${result || '—'}</div><button class="copy-button" type="button" data-copy="${type}" ${result ? '' : 'disabled'}>Copy</button></div></article>`; }).join('')}</div></section>`; }).join(''); sections.querySelectorAll('[data-copy]').forEach(button => button.addEventListener('click', async () => { const valueToCopy = transform(input.value, button.dataset.copy); try { await navigator.clipboard.writeText(valueToCopy); button.textContent = 'Copied'; showToast('Copied to clipboard'); setTimeout(() => { button.textContent = 'Copy'; }, 1200); } catch { showToast('Copy failed — select the text manually'); } })); }
      function showToast(message) { toast.textContent = message; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 1800); }
      input.addEventListener('input', render); clearButton.addEventListener('click', () => { input.value = ''; input.focus(); render(); });
      const themeToggle = document.getElementById('theme-toggle'); function setTheme(light) { document.body.classList.toggle('light', light); themeToggle.setAttribute('aria-label', light ? 'Switch to dark mode' : 'Switch to light mode'); localStorage.setItem('case-converter-theme', light ? 'light' : 'dark'); } themeToggle.addEventListener('click', () => setTheme(!document.body.classList.contains('light'))); setTheme(localStorage.getItem('case-converter-theme') === 'light'); render();
    </script>
  </body>
</html>
